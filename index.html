<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synapse LifeOS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Мой План</h1>

    <div class="dashboard-container">
        <div class="progress-card">
            <div class="ring-container">
                <svg class="progress-ring" width="120" height="120">
                    <circle class="progress-ring__circle-bg" stroke="#E5E5EA" stroke-width="8" fill="transparent" r="52" cx="60" cy="60"/>
                    <circle class="progress-ring__circle" stroke="#007AFF" stroke-width="8" fill="transparent" r="52" cx="60" cy="60"/>
                </svg>
                <div class="ring-text">
                    <span id="percent-text">0%</span>
                </div>
            </div>
            <div class="stats-text">
                <h3>Эффективность</h3>
                <p>Сделано: <span id="done-count">0</span> / <span id="total-count">0</span></p>
                <p id="motivation-msg">Загрузка...</p>
            </div>
        </div>
    </div>

    <div class="input-group">
        <select id="new-item-type">
            <option value="task">✅ Задача</option>
            <option value="habit">🔄 Привычка</option>
        </select>
        <input type="text" id="new-task-title" placeholder="Название..." autocomplete="off">
        <select id="new-task-priority">
            <option value="High">🔥 Важно</option>
            <option value="Medium" selected>⭐️ Обычно</option>
            <option value="Low">☕️ Изи</option>
        </select>
        <button class="add-btn" onclick="addItem()">+</button>
    </div>

    <h3 class="section-title">Привычки</h3>
    <div id="habits-list" class="list-container">
        <div class="loading">Загрузка...</div>
    </div>

    <h3 class="section-title">Задачи</h3>
    <div id="tasks-list" class="list-container">
        </div>

    <script src="app.js"></script>
</body>
</html>
